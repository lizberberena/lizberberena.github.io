# Site Info
title:              "Portfolio of Liz Berberena"
description:        "Liz Berberena is a web developer and digital content specialist with over 7 years of professional experience and a passion for coding and design since 2013."

# Author Info
author_name:        Liz Berberena
username:           lizberberena

# Site Settings
baseurl:            "" # Base URL must end WITHOUT a slash, default: ""
permalink:          /projects/:title # Post permalink
timezone:           America/New_York # https://en.wikipedia.org/wiki/List_of_tz_database_time_zones
language:           en-US
favicon:            https://lizberberena.com/img/sitewideimg.png
logo:               https://lizberberena.com/img/sitewideimg.png
image:              https://lizberberena.com/img/2026-09-lizberberena.com-dark.png

# Pagination Settings
paginate_path: "/pg-:num/"
paginate: 5

# Site Build
highlighter: rouge
markdown: kramdown
gems:
  - jekyll-sitemap
  - tzinfo
plugins:
  - jekyll-feed
  - jekyll-paginate

defaults:
  -
    scope:
      path:         ""
    values:
      layout:       "null"
  -
    scope:
      type:         "pages"
    values:
      layout:       "page"
  -
    scope:
      type:          "posts"
    values:
      layout:        "post"

